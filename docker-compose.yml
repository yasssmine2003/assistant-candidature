# Lance l'API et l'interface ensemble, à partir de la MÊME image :
#     docker compose up --build
# API       : http://localhost:8000/docs
# Interface : http://localhost:8501
services:
  api:
    build: .
    image: assistant-candidature:1.0
    command: uvicorn src.assistant.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env          # les clés (Groq, Qdrant) sont lues ici, au démarrage, jamais copiées dans l'image
    restart: unless-stopped

  interface:
    build: .                # même Dockerfile : la 2e construction reprend tout du cache (quelques secondes)
    image: assistant-candidature:1.0
    depends_on:
      - api
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.fileWatcherType none
    ports:
      - "8501:8501"
    env_file: .env
    restart: unless-stopped
    healthcheck:            # le HEALTHCHECK du Dockerfile vise l'API ; ici on vérifie Streamlit
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      start_period: 60s